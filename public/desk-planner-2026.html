<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transcend Property Maintenance® — Desk Planner 2026</title>
<style>
  :root {
    --navy:    #1d3461;
    --navy2:   #152848;
    --gold:    #f5c518;
    --gold2:   #e8b400;
    --mid:     #4a6fa5;
    --muted:   #8a9dc0;
    --line:    #d0d8e8;
    --text:    #1d3461;
    --white:   #ffffff;
    --offwhite:#f7f8fc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #b0b8c8;
    color: var(--text);
  }

  #print-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
    background: var(--navy2); color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 16px;
    padding: 9px 20px; font-size: 12px; letter-spacing: .08em;
  }
  #print-bar button {
    background: var(--gold); color: var(--navy2);
    border: none; padding: 6px 22px;
    font-weight: 800; font-size: 11px; letter-spacing: .12em;
    cursor: pointer; border-radius: 2px;
  }

  .page {
    width: 210mm;
    height: 297mm;
    background: var(--white);
    margin: 5mm auto;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* ══════════════════════════════════════════
     COVER PAGE
  ══════════════════════════════════════════ */
  .cover-page {
    background: var(--navy);
    color: var(--white);
    padding: 0;
    position: relative;
    overflow: hidden;
  }

  .cover-top {
    background: var(--navy);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14mm 12mm 10mm;
    flex: 1.4;
    position: relative;
  }

  /* decorative diagonal accent top-right */
  .cover-top::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 40mm; height: 40mm;
    background: var(--navy2);
    clip-path: polygon(100% 0, 0 0, 100% 100%);
  }
  .cover-top::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 25mm; height: 25mm;
    background: rgba(245,197,24,.08);
    clip-path: polygon(0 100%, 0 0, 100% 100%);
  }

  /* TPM geometric mark — SVG inline */
  .tpm-mark { margin-bottom: 6mm; }

  .cover-brand-name {
    font-size: 26pt;
    font-weight: 900;
    letter-spacing: .06em;
    color: var(--white);
    line-height: 1;
    text-align: center;
  }

  .cover-brand-sub {
    font-size: 9.5pt;
    font-weight: 600;
    letter-spacing: .25em;
    color: var(--gold);
    text-align: center;
    margin-top: 1.5mm;
  }

  .cover-divider {
    width: 40mm;
    height: .5pt;
    background: rgba(255,255,255,.3);
    margin: 5mm auto;
  }

  .cover-tagline {
    font-size: 6.5pt;
    letter-spacing: .2em;
    color: var(--muted);
    text-align: center;
  }

  /* Middle banner */
  .cover-banner {
    background: var(--white);
    padding: 8mm 12mm;
    text-align: center;
    flex: 0 0 auto;
    border-top: 3pt solid var(--gold);
    border-bottom: 3pt solid var(--gold);
  }

  .cover-planner-label {
    font-size: 7pt;
    font-weight: 700;
    letter-spacing: .35em;
    color: var(--mid);
    margin-bottom: 2mm;
  }

  .cover-planner-title {
    font-size: 24pt;
    font-weight: 900;
    letter-spacing: .04em;
    color: var(--navy);
    line-height: 1;
  }

  .cover-planner-year {
    font-size: 20pt;
    font-weight: 300;
    letter-spacing: .15em;
    color: var(--navy);
  }

  .cover-planner-sub {
    font-size: 7pt;
    font-weight: 400;
    letter-spacing: .18em;
    color: var(--mid);
    margin-top: 2.5mm;
    font-style: italic;
  }

  /* Dot row (spiral binding visual) */
  .spiral-dots {
    display: flex;
    justify-content: center;
    gap: 3mm;
    padding: 4mm 0;
    background: var(--navy2);
  }
  .spiral-dot {
    width: 4mm; height: 4mm;
    border-radius: 50%;
    background: rgba(255,255,255,.25);
    border: .5pt solid rgba(255,255,255,.15);
  }

  /* Bottom icons */
  .cover-bottom {
    background: var(--navy2);
    padding: 6mm 12mm 7mm;
    flex: 0 0 auto;
  }

  .cover-icons-row {
    display: flex;
    justify-content: space-around;
    align-items: flex-start;
    gap: 2mm;
    margin-bottom: 5mm;
  }

  .cover-icon-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2mm;
    flex: 1;
  }

  .cover-icon-circle {
    width: 11mm; height: 11mm;
    border-radius: 50%;
    background: rgba(255,255,255,.1);
    border: .7pt solid rgba(245,197,24,.4);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    font-size: 14pt;
  }

  .cover-icon-label {
    font-size: 4.5pt;
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--white);
    text-align: center;
    line-height: 1.4;
  }

  .cover-icon-sub {
    font-size: 3.8pt;
    color: var(--muted);
    letter-spacing: .08em;
    text-align: center;
  }

  .cover-footer-line {
    text-align: center;
    font-size: 6pt;
    letter-spacing: .25em;
    color: rgba(255,255,255,.5);
    font-style: italic;
    padding-top: 2mm;
    border-top: .3pt solid rgba(255,255,255,.15);
  }

  /* ══════════════════════════════════════════
     INSIDE COVER / PRINT INSTRUCTIONS
  ══════════════════════════════════════════ */
  .inside-cover {
    background: var(--offwhite);
    padding: 11mm 11mm 8mm;
  }

  .ic-header {
    border-bottom: 1.5pt solid var(--navy);
    padding-bottom: 3mm;
    margin-bottom: 4mm;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .ic-logo-img { height: 14mm; width: auto; }

  .ic-header-text { text-align: right; }
  .ic-header-title {
    font-size: 8pt; font-weight: 900; letter-spacing: .2em; color: var(--navy);
  }
  .ic-header-sub {
    font-size: 5.5pt; letter-spacing: .15em; color: var(--mid); margin-top: 1mm;
  }

  .ic-planner-for {
    margin-bottom: 5mm;
  }
  .ic-label {
    font-size: 5pt; font-weight: 700; letter-spacing: .25em; color: var(--mid);
    margin-bottom: 1.5mm;
  }
  .ic-handwriting-line {
    border-bottom: 1pt solid var(--navy);
    height: 8mm;
    position: relative;
  }
  .ic-handwriting-hint {
    position: absolute;
    bottom: 2mm; left: 2mm;
    font-size: 9pt;
    font-style: italic;
    color: var(--gold2);
    font-family: Georgia, 'Times New Roman', serif;
    letter-spacing: .04em;
  }

  .ic-two-col {
    display: flex;
    gap: 6mm;
    flex: 1;
  }

  .ic-col { flex: 1; display: flex; flex-direction: column; gap: 4mm; }

  .ic-section-title {
    font-size: 5.5pt; font-weight: 900; letter-spacing: .22em; color: var(--navy);
    border-bottom: .7pt solid var(--navy);
    padding-bottom: 1mm; margin-bottom: 2mm;
  }

  .ic-bullet {
    display: flex; gap: 2mm; align-items: flex-start;
    margin-bottom: 2mm;
  }
  .ic-bullet-dot {
    width: 2mm; height: 2mm; min-width: 2mm; border-radius: 50%;
    background: var(--gold);
    margin-top: 1.5mm; flex-shrink: 0;
  }
  .ic-bullet-text { font-size: 6pt; line-height: 1.5; color: var(--text); }

  .ic-priority-row {
    display: flex; align-items: center; gap: 2mm; margin-bottom: 1.8mm;
  }
  .ic-priority-num {
    font-size: 6pt; font-weight: 800; color: var(--navy);
    width: 3.5mm; text-align: right; flex-shrink: 0;
  }
  .ic-priority-line { flex: 1; border-bottom: .3pt solid var(--line); height: 4.5mm; }

  .ic-contact-row {
    display: flex; align-items: center; gap: 1.5mm; margin-bottom: 1.5mm;
  }
  .ic-contact-icon { color: var(--mid); font-size: 7pt; width: 4mm; text-align: center; flex-shrink: 0; }
  .ic-contact-line { flex: 1; border-bottom: .3pt solid var(--line); height: 4mm; }

  .ic-notes-lines { display: flex; flex-direction: column; gap: 0; }
  .ic-nl { border-bottom: .3pt solid var(--line); height: 4.5mm; }

  .ic-footer {
    border-top: 1pt solid var(--navy);
    padding-top: 2mm;
    margin-top: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 8mm;
    flex-shrink: 0;
  }
  .ic-footer-kw { font-size: 5pt; font-weight: 800; letter-spacing: .18em; color: var(--navy); }
  .ic-footer-sep { color: var(--mid); font-size: 5pt; margin: 0 1.5mm; }
  .ic-footer-qt { font-size: 4.5pt; font-style: italic; color: var(--mid); }

  /* ══════════════════════════════════════════
     PRINT INSTRUCTIONS PAGE
  ══════════════════════════════════════════ */
  .print-instr-page {
    background: var(--white);
    padding: 12mm 14mm;
    display: flex;
    flex-direction: column;
    gap: 5mm;
  }

  .pi-header {
    display: flex; align-items: center; gap: 5mm;
    border-bottom: 1.5pt solid var(--navy);
    padding-bottom: 4mm;
  }

  .pi-logo-img { height: 16mm; width: auto; }

  .pi-header-text { }
  .pi-title { font-size: 13pt; font-weight: 900; letter-spacing: .08em; color: var(--navy); }
  .pi-sub   { font-size: 5.5pt; letter-spacing: .2em; color: var(--mid); margin-top: 1mm; }

  .pi-section-title {
    font-size: 6pt; font-weight: 900; letter-spacing: .22em; color: var(--navy);
    border-left: 2pt solid var(--gold);
    padding-left: 3mm; margin-bottom: 3mm;
  }

  .pi-step {
    display: flex; gap: 3mm; align-items: flex-start;
    margin-bottom: 3mm;
  }
  .pi-step-num {
    width: 6mm; height: 6mm; min-width: 6mm; border-radius: 50%;
    background: var(--navy); color: #fff;
    font-size: 7pt; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .pi-step-body { flex: 1; }
  .pi-step-title { font-size: 7pt; font-weight: 800; color: var(--navy); letter-spacing: .06em; }
  .pi-step-text  { font-size: 6pt; color: var(--mid); line-height: 1.6; margin-top: .5mm; }

  .pi-tip-box {
    background: var(--navy); color: var(--white);
    border-radius: 2px;
    padding: 4mm 5mm;
    margin-top: 2mm;
  }
  .pi-tip-title {
    font-size: 5.5pt; font-weight: 900; letter-spacing: .2em; color: var(--gold);
    margin-bottom: 2mm;
  }
  .pi-tip-row {
    display: flex; gap: 2mm; align-items: baseline;
    margin-bottom: 1.5mm;
  }
  .pi-tip-bullet { color: var(--gold); font-size: 8pt; flex-shrink: 0; line-height: 1; }
  .pi-tip-text { font-size: 6pt; line-height: 1.5; color: rgba(255,255,255,.85); }

  .pi-layout-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4mm;
    margin-top: 1mm;
  }
  .pi-layout-item {
    border: .5pt solid var(--line);
    border-radius: 2px;
    padding: 3mm;
    background: var(--offwhite);
  }
  .pi-layout-item-title {
    font-size: 5.5pt; font-weight: 800; letter-spacing: .15em; color: var(--navy);
    border-bottom: .5pt solid var(--line); padding-bottom: 1mm; margin-bottom: 1.5mm;
  }
  .pi-layout-item-text { font-size: 5.5pt; color: var(--mid); line-height: 1.6; }

  .pi-footer {
    margin-top: auto;
    border-top: 1pt solid var(--navy);
    padding-top: 2mm;
    display: flex; justify-content: space-between; align-items: center;
    height: 8mm; flex-shrink: 0;
  }
  .pi-footer-brand { font-size: 5pt; font-weight: 800; letter-spacing: .15em; color: var(--navy); }
  .pi-footer-copy  { font-size: 4.5pt; color: var(--mid); }

  /* ══════════════════════════════════════════
     LEFT PAGE (weekly schedule)
  ══════════════════════════════════════════ */
  .left-page { padding: 7mm 8mm 6mm 10mm; }

  .lp-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1.2pt solid var(--navy);
    padding-bottom: 2mm;
    margin-bottom: 2mm;
  }

  .lp-logo-img { height: 11mm; width: auto; }

  .lp-week-block { text-align: center; }
  .lp-week-label { font-size: 4.5pt; letter-spacing: .22em; color: var(--mid); }
  .lp-week-dates { font-size: 10pt; font-weight: 800; letter-spacing: .04em; color: var(--navy); }
  .lp-tagline    { font-size: 4pt; letter-spacing: .15em; color: var(--mid); margin-top: .5mm; }

  .lp-reg-mark { font-size: 5pt; vertical-align: super; }

  .days-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .day-row {
    display: flex;
    flex: 1;
    border-bottom: .3pt solid var(--line);
    min-height: 0;
  }
  .day-row.weekend { flex: .65; }

  .day-tag {
    width: 14mm; min-width: 14mm;
    border-right: 1pt solid var(--navy);
    padding: 2mm 2mm 0 0;
    display: flex; flex-direction: column;
  }
  .day-row.weekend .day-tag {
    justify-content: space-around;
    padding: 2mm;
  }

  .day-name  { font-size: 7pt; font-weight: 900; letter-spacing: .08em; }
  .day-date  { font-size: 5pt; font-weight: 400; color: var(--mid); margin-top: .6mm; }

  .day-body {
    flex: 1; padding: 1.5mm 0 1mm 3mm;
    display: flex; flex-direction: column;
  }

  .appt-label {
    font-size: 4pt; letter-spacing: .2em; color: var(--muted);
    margin-bottom: 1mm;
  }

  .ruled-lines { flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
  .ruled-line  { border-bottom: .25pt solid var(--line); }

  .wn-section {
    border-top: 1pt solid var(--navy);
    padding-top: 1.5mm;
    margin-top: 1mm;
    height: 20mm;
    flex-shrink: 0;
    display: flex; flex-direction: column;
  }

  .lp-footer {
    height: 7mm; flex-shrink: 0;
    border-top: 1pt solid var(--navy);
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 1mm;
  }

  .footer-kw  { font-size: 4.5pt; font-weight: 800; letter-spacing: .18em; color: var(--navy); }
  .footer-sep { color: var(--muted); font-size: 5pt; margin: 0 1mm; }
  .footer-qt  { font-size: 4pt; font-style: italic; color: var(--muted); }

  /* ══════════════════════════════════════════
     RIGHT PAGE
  ══════════════════════════════════════════ */
  .right-page { padding: 7mm 8mm 6mm 8mm; }

  .rp-topbar {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1.2pt solid var(--navy);
    padding-bottom: 2mm; margin-bottom: 2mm;
  }

  .month-tabs { display: flex; gap: .8mm; }
  .mtab {
    font-size: 4.5pt; font-weight: 700; letter-spacing: .1em;
    color: var(--mid); padding: .7mm 1.5mm; border-radius: 1px;
  }
  .mtab.active { background: var(--navy); color: var(--white); }

  .week-no-wrap { display: flex; align-items: center; gap: 2mm; }
  .week-no-lbl  { font-size: 4.5pt; font-weight: 700; letter-spacing: .18em; color: var(--navy); }
  .week-no-val  { font-size: 8pt; font-weight: 800; color: var(--navy); }

  .rp-body { flex: 1; display: flex; gap: 4mm; overflow: hidden; min-height: 0; }
  .rp-col  { display: flex; flex-direction: column; overflow: hidden; }
  .rp-col-l { flex: 1.15; }
  .rp-col-r { flex: 1; }

  .rp-sec { display: flex; flex-direction: column; margin-bottom: 3mm; }
  .rp-sec-title {
    font-size: 4.5pt; font-weight: 900; letter-spacing: .22em; color: var(--navy);
    border-bottom: .7pt solid var(--navy);
    padding-bottom: .8mm; margin-bottom: 1.5mm;
  }
  .rp-sub {
    font-size: 4pt; font-weight: 700; letter-spacing: .15em; color: var(--mid);
    margin: 1mm 0 .6mm;
  }

  .cb-row { display: flex; align-items: center; gap: 1.5mm; margin-bottom: .9mm; }
  .cb { width: 2.6mm; height: 2.6mm; min-width: 2.6mm; border: .5pt solid var(--navy); flex-shrink: 0; }
  .cb-line { flex: 1; border-bottom: .25pt solid var(--line); height: 3.6mm; }

  .nl { border-bottom: .25pt solid var(--line); height: 4.2mm; }

  .appt-row { display: flex; gap: 1.5mm; align-items: flex-end; margin-bottom: 1.6mm; }
  .af { border-bottom: .6pt solid var(--navy); height: 3.6mm; }
  .af-date { width: 13mm; }
  .af-time { width: 9mm; }
  .af-desc { flex: 1; }

  .rp-footer {
    height: 7mm; flex-shrink: 0;
    border-top: 1pt solid var(--navy);
    display: flex; align-items: center; justify-content: space-between;
    margin-top: auto;
  }

  /* ══════════════════════════════════════════
     PRINT RULES
  ══════════════════════════════════════════ */
  @media print {
    @page { size: A4 portrait; margin: 0; }
    body  { background: white; }
    #print-bar { display: none; }
    .page {
      margin: 0;
      page-break-after: always;
      break-after: page;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>
</head>
<body>

<div id="print-bar">
  <span>TRANSCEND® PROPERTY MAINTENANCE — DESK PLANNER 2026 — JULY TO DECEMBER</span>
  <button onclick="window.print()">PRINT ALL PAGES</button>
</div>

<div id="planner"></div>

<script>
(function () {
  // ── Logos (loaded from same folder, resolved by Playwright via file://) ──
  const LOGO_BLACK = 'transcend-logo-black.png';
  const LOGO_COLOR = 'transcend-logo-color.png';

  const MONTHS      = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const PLAN_MONTHS = ['JUL','AUG','SEP','OCT','NOV','DEC'];
  const DAYS        = ['MON','TUE','WED','THU','FRI'];

  const QUOTES = [
    '"Plan with purpose. Execute with discipline."',
    '"Small daily improvements lead to stunning results."',
    '"Consistency beats intensity every time."',
    '"Focus is the new superpower."',
    '"Growth begins at the edge of comfort."',
    '"What you do today shapes who you become."',
    '"One week, one mission. Make it count."',
    '"Clarity precedes mastery."',
    '"Progress, not perfection."',
    '"The disciplined life is the free life."',
    '"Show up. Do the work. Repeat."',
    '"Every great week starts with a clear plan."',
    '"Win the morning, win the day."',
    '"Think long. Act now."',
    '"Your habits are your future."',
    '"Build something worth building."',
    '"Execution separates dreamers from achievers."',
    '"Stay the course. The results are coming."',
    '"Do less, better."',
    '"Silence the noise. Amplify the signal."',
    '"Great things are done by a series of small things."',
    '"Commit fully. Adjust wisely."',
    '"Purpose fuels persistence."',
    '"Discipline Today. Freedom Tomorrow."',
    '"Chase progress, not perfection."',
    '"Be relentless in the pursuit of your goals."',
    '"Vision without action is a daydream."',
  ];

  function fmt(d) { return MONTHS[d.getMonth()] + ' ' + d.getDate(); }

  function lines(n, cls) {
    let h = '';
    for (let i = 0; i < n; i++) h += `<div class="${cls}"></div>`;
    return h;
  }
  function cbRows(n) {
    let h = '';
    for (let i = 0; i < n; i++)
      h += `<div class="cb-row"><div class="cb"></div><div class="cb-line"></div></div>`;
    return h;
  }
  function apptRows(n) {
    let h = '';
    for (let i = 0; i < n; i++)
      h += `<div class="appt-row"><div class="af af-date"></div><div class="af af-time"></div><div class="af af-desc"></div></div>`;
    return h;
  }
  function monthTabs(monthIdx) {
    return PLAN_MONTHS.map(m =>
      `<span class="mtab${MONTHS[monthIdx] === m ? ' active' : ''}">${m}</span>`
    ).join('');
  }

  /* ── Cover Page ── */
  function coverPage() {
    const dots = Array(18).fill('<div class="spiral-dot"></div>').join('');
    return `
      <div class="page cover-page">
        <div class="cover-top">
          <!-- TPM geometric mark as SVG -->
          <div class="tpm-mark">
            <svg width="52" height="42" viewBox="0 0 52 42" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- T shape -->
              <rect x="0"  y="0"  width="16" height="5" fill="#f5c518"/>
              <rect x="5.5" y="5" width="5"  height="28" fill="#f5c518"/>
              <!-- P shape -->
              <rect x="19" y="0" width="5"  height="33" fill="#4a9fd4"/>
              <path d="M24 0 h7 a8 8 0 0 1 0 16 h-7 z" fill="#4a9fd4"/>
              <!-- M shape -->
              <rect x="35" y="0"  width="5"  height="33" fill="#5bbf8a"/>
              <rect x="44" y="0"  width="5"  height="33" fill="#5bbf8a"/>
              <polygon points="35,0 40,0 44,14 44,0 49,0 44,20 40,20" fill="#5bbf8a"/>
            </svg>
          </div>

  /* ── Build week list ── */
  function buildWeeks() {
    const weeks = [];
    let monday = new Date(2026, 5, 29); // Jun 29
    let weekNum = 27;
    const last = new Date(2026, 11, 28); // Dec 28
    while (monday <= last) {
      const wd = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday); d.setDate(d.getDate() + i); wd.push(d);
      }
      const end = new Date(monday); end.setDate(end.getDate() + 6);
      weeks.push({ weekNum, start: new Date(monday), end, days: wd });
      monday.setDate(monday.getDate() + 7);
      weekNum++;
    }
    return weeks;
  }

  /* ── Render ── */
  const weeks = buildWeeks();
  const container = document.getElementById('planner');
  let html = '';

  html += coverPage();
  html += insideCover();
  html += printInstructionsPage();

  weeks.forEach((week, idx) => {
    html += leftPage(week, idx);
    html += rightPage(week);
  });

  container.innerHTML = html;
  console.log('Generated: cover + inside cover + print instructions + ' + weeks.length + ' weeks = ' + (3 + weeks.length * 2) + ' pages total.');
})();
