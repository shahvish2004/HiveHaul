<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transcend Property Maintenance® — Desk Planner 2026</title>
<style>
  :root {
    --navy:    #1d3461;
    --navy2:   #152848;
    --gold:    #f5c518;
    --gold2:   #e8b400;
    --mid:     #4a6fa5;
    --muted:   #8a9dc0;
    --line:    #d0d8e8;
    --text:    #1d3461;
    --white:   #ffffff;
    --offwhite:#f7f8fc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #b0b8c8;
    color: var(--text);
  }

  #print-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
    background: var(--navy2); color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 16px;
    padding: 9px 20px; font-size: 12px; letter-spacing: .08em;
  }
  #print-bar button {
    background: var(--gold); color: var(--navy2);
    border: none; padding: 6px 22px;
    font-weight: 800; font-size: 11px; letter-spacing: .12em;
    cursor: pointer; border-radius: 2px;
  }

  /* ── A5 page shell ── */
  .page {
    width: 148mm;
    height: 210mm;
    background: var(--white);
    margin: 5mm auto;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* ══════════════════════════════════════════
     COVER PAGE  (A5, navy)
  ══════════════════════════════════════════ */
  .cover-page {
    background: var(--navy);
    color: var(--white);
    padding: 0;
  }

  .cover-top {
    background: var(--navy);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 10mm 9mm 7mm;
    flex: 1.4;
    position: relative;
  }
  .cover-top::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 28mm; height: 28mm; background: var(--navy2);
    clip-path: polygon(100% 0, 0 0, 100% 100%);
  }

  .cover-logo-img {
    width: 76mm; max-width: 90%; margin-bottom: 3mm;
  }
  .cover-divider {
    width: 30mm; height: .5pt; background: rgba(255,255,255,.3); margin: 4mm auto;
  }
  .cover-tagline {
    font-size: 5pt; letter-spacing: .18em; color: var(--muted); text-align: center;
  }

  .cover-banner {
    background: var(--white);
    padding: 6mm 9mm; text-align: center;
    flex: 0 0 auto;
    border-top: 2.5pt solid var(--gold);
    border-bottom: 2.5pt solid var(--gold);
  }
  .cover-planner-label {
    font-size: 5.5pt; font-weight: 700; letter-spacing: .3em; color: var(--mid); margin-bottom: 1.5mm;
  }
  .cover-planner-title {
    font-size: 18pt; font-weight: 900; letter-spacing: .04em; color: var(--navy); line-height: 1;
  }
  .cover-planner-year  { font-size: 15pt; font-weight: 300; letter-spacing: .12em; color: var(--navy); }
  .cover-planner-sub   {
    font-size: 5.5pt; font-weight: 400; letter-spacing: .15em;
    color: var(--mid); margin-top: 2mm; font-style: italic;
  }

  .spiral-dots {
    display: flex; justify-content: center; gap: 2.5mm;
    padding: 3mm 0; background: var(--navy2);
  }
  .spiral-dot {
    width: 3.5mm; height: 3.5mm; border-radius: 50%;
    background: rgba(255,255,255,.22); border: .5pt solid rgba(255,255,255,.12);
  }

  .cover-bottom {
    background: var(--navy2); padding: 4mm 9mm 5mm; flex: 0 0 auto;
  }
  .cover-icons-row {
    display: flex; justify-content: space-around; align-items: flex-start;
    gap: 1.5mm; margin-bottom: 4mm;
  }
  .cover-icon-item {
    display: flex; flex-direction: column; align-items: center; gap: 1.5mm; flex: 1;
  }
  .cover-icon-circle {
    width: 9mm; height: 9mm; border-radius: 50%;
    background: rgba(255,255,255,.1); border: .6pt solid rgba(245,197,24,.4);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold); font-size: 12pt;
  }
  .cover-icon-label  { font-size: 3.8pt; font-weight: 700; letter-spacing: .1em; color: var(--white); text-align: center; line-height: 1.4; }
  .cover-icon-sub    { font-size: 3.2pt; color: var(--muted); letter-spacing: .06em; text-align: center; }
  .cover-footer-line {
    text-align: center; font-size: 5pt; letter-spacing: .2em;
    color: rgba(255,255,255,.45); font-style: italic;
    padding-top: 2mm; border-top: .3pt solid rgba(255,255,255,.12);
  }

  /* ══════════════════════════════════════════
     INSIDE COVER  (A5)
  ══════════════════════════════════════════ */
  .inside-cover { padding: 8mm 8mm 6mm; background: var(--offwhite); }

  .ic-header {
    display: flex; align-items: center; gap: 4mm;
    border-bottom: 1.2pt solid var(--navy);
    padding-bottom: 2.5mm; margin-bottom: 3mm;
  }
  .ic-logo-img   { height: 10mm; width: auto; }
  .ic-header-text { flex: 1; }
  .ic-header-title { font-size: 7pt; font-weight: 900; letter-spacing: .15em; color: var(--navy); }
  .ic-header-sub   { font-size: 4pt; letter-spacing: .12em; color: var(--mid); margin-top: .6mm; }

  .ic-planner-for { margin-bottom: 3.5mm; }
  .ic-label { font-size: 4pt; font-weight: 700; letter-spacing: .22em; color: var(--mid); margin-bottom: 1.2mm; }
  .ic-handwriting-line { border-bottom: 1pt solid var(--navy); height: 7mm; position: relative; }
  .ic-handwriting-hint {
    position: absolute; bottom: 1.5mm; left: 2mm;
    font-size: 8pt; font-style: italic; color: var(--gold2);
    font-family: Georgia, serif; letter-spacing: .04em;
  }

  .ic-two-col { display: flex; gap: 4mm; flex: 1; overflow: hidden; }
  .ic-col     { flex: 1; display: flex; flex-direction: column; gap: 3mm; overflow: hidden; }

  .ic-section-title {
    font-size: 4.5pt; font-weight: 900; letter-spacing: .2em; color: var(--navy);
    border-bottom: .6pt solid var(--navy); padding-bottom: .8mm; margin-bottom: 1.5mm;
  }

  .ic-bullet { display: flex; gap: 1.5mm; align-items: flex-start; margin-bottom: 1.8mm; }
  .ic-bullet-dot { width: 1.8mm; height: 1.8mm; min-width: 1.8mm; border-radius: 50%; background: var(--gold); margin-top: 1.2mm; flex-shrink: 0; }
  .ic-bullet-text { font-size: 5pt; line-height: 1.5; color: var(--text); }

  .ic-priority-row { display: flex; align-items: center; gap: 1.5mm; margin-bottom: 1.5mm; }
  .ic-priority-num { font-size: 5pt; font-weight: 800; color: var(--navy); width: 3mm; text-align: right; flex-shrink: 0; }
  .ic-priority-line { flex: 1; border-bottom: .3pt solid var(--line); height: 4mm; }

  .ic-contact-row { display: flex; align-items: center; gap: 1.5mm; margin-bottom: 1.5mm; }
  .ic-contact-icon { color: var(--mid); font-size: 6pt; width: 3.5mm; text-align: center; flex-shrink: 0; }
  .ic-contact-line { flex: 1; border-bottom: .3pt solid var(--line); height: 3.8mm; }

  .ic-nl { border-bottom: .3pt solid var(--line); height: 4mm; }

  .ic-footer {
    border-top: 1pt solid var(--navy); padding-top: 1.5mm; margin-top: auto;
    display: flex; justify-content: space-between; align-items: center;
    height: 7mm; flex-shrink: 0;
  }
  .ic-footer-kw  { font-size: 4pt; font-weight: 800; letter-spacing: .16em; color: var(--navy); }
  .ic-footer-sep { color: var(--mid); font-size: 4pt; margin: 0 1mm; }
  .ic-footer-qt  { font-size: 3.8pt; font-style: italic; color: var(--mid); }

  /* ══════════════════════════════════════════
     PRINT SHOP SPECIFICATION PAGE  (A5)
  ══════════════════════════════════════════ */
  .print-spec-page { padding: 8mm 8mm 6mm; display: flex; flex-direction: column; gap: 0; }

  .ps-header {
    display: flex; align-items: center; gap: 4mm;
    border-bottom: 1.5pt solid var(--navy); padding-bottom: 2.5mm; margin-bottom: 3.5mm;
  }
  .ps-logo-img { height: 10mm; width: auto; }
  .ps-header-text { flex: 1; }
  .ps-title  { font-size: 8pt; font-weight: 900; letter-spacing: .12em; color: var(--navy); }
  .ps-sub    { font-size: 4pt; letter-spacing: .15em; color: var(--mid); margin-top: .5mm; }

  .ps-order-box {
    background: var(--navy); color: var(--white);
    padding: 3.5mm 4mm; border-radius: 2px; margin-bottom: 3.5mm;
  }
  .ps-order-title {
    font-size: 5pt; font-weight: 900; letter-spacing: .2em; color: var(--gold);
    margin-bottom: 2mm;
  }
  .ps-order-row {
    display: flex; gap: 2mm; margin-bottom: 1.2mm; align-items: flex-start;
  }
  .ps-order-lbl  { font-size: 4.5pt; font-weight: 700; letter-spacing: .1em; color: var(--muted); min-width: 24mm; }
  .ps-order-val  { font-size: 4.5pt; color: rgba(255,255,255,.9); font-weight: 600; flex: 1; line-height: 1.5; }
  .ps-order-val.fill {
    border-bottom: .4pt solid rgba(255,255,255,.3); min-width: 20mm; color: rgba(255,255,255,.4);
    font-style: italic;
  }

  .ps-two-col { display: flex; gap: 3mm; margin-bottom: 3mm; }
  .ps-col { flex: 1; }

  .ps-spec-title {
    font-size: 4.5pt; font-weight: 900; letter-spacing: .2em; color: var(--navy);
    border-left: 2pt solid var(--gold); padding-left: 2.5mm;
    margin-bottom: 2mm;
  }

  .ps-spec-row { display: flex; gap: 1.5mm; margin-bottom: 1.5mm; align-items: flex-start; }
  .ps-spec-icon { color: var(--gold2); font-size: 6pt; flex-shrink: 0; margin-top: .2mm; }
  .ps-spec-body { flex: 1; }
  .ps-spec-item-title { font-size: 4.5pt; font-weight: 800; color: var(--navy); letter-spacing: .06em; }
  .ps-spec-item-val   { font-size: 4pt; color: var(--mid); line-height: 1.5; margin-top: .2mm; }

  .ps-note-box {
    background: var(--offwhite); border: .5pt solid var(--line); border-radius: 2px;
    padding: 2.5mm 3mm; margin-bottom: 3mm;
  }
  .ps-note-title { font-size: 4pt; font-weight: 900; letter-spacing: .18em; color: var(--mid); margin-bottom: 1.5mm; }
  .ps-note-text  { font-size: 4pt; color: var(--mid); line-height: 1.6; }

  .ps-sign-row {
    display: flex; gap: 4mm; align-items: flex-end; margin-top: auto;
  }
  .ps-sign-field {
    flex: 1; display: flex; flex-direction: column; gap: 1mm;
  }
  .ps-sign-label { font-size: 4pt; letter-spacing: .15em; color: var(--mid); }
  .ps-sign-line  { border-bottom: .7pt solid var(--navy); height: 6mm; }

  .ps-footer {
    border-top: 1pt solid var(--navy); padding-top: 1.5mm; margin-top: 2mm;
    display: flex; justify-content: space-between; align-items: center;
    height: 6mm; flex-shrink: 0;
  }
  .ps-footer-brand { font-size: 4pt; font-weight: 800; letter-spacing: .12em; color: var(--navy); }
  .ps-footer-copy  { font-size: 3.8pt; color: var(--mid); }

  /* ══════════════════════════════════════════
     LEFT PAGE — WEEKLY SCHEDULE  (A5)
  ══════════════════════════════════════════ */
  .left-page { padding: 5mm 6mm 4mm 7mm; }

  .lp-header {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1pt solid var(--navy);
    padding-bottom: 1.5mm; margin-bottom: 1.5mm;
  }
  .lp-logo-img   { height: 8.5mm; width: auto; }
  .lp-week-block { text-align: center; }
  .lp-week-label { font-size: 3.8pt; letter-spacing: .2em; color: var(--mid); }
  .lp-week-dates { font-size: 8.5pt; font-weight: 800; letter-spacing: .04em; color: var(--navy); }
  .lp-tagline    { font-size: 3.5pt; letter-spacing: .12em; color: var(--mid); margin-top: .4mm; }
  .lp-reg-mark   { font-size: 4pt; vertical-align: super; }
  .lp-spacer     { width: 18mm; }

  .days-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .day-row { display: flex; flex: 1; border-bottom: .3pt solid var(--line); min-height: 0; }
  .day-row.weekend { flex: .6; }

  .day-tag {
    width: 11mm; min-width: 11mm;
    border-right: .8pt solid var(--navy);
    padding: 1.5mm 1.5mm 0 0;
    display: flex; flex-direction: column;
  }
  .day-row.weekend .day-tag { justify-content: space-around; padding: 1.5mm; }

  .day-name  { font-size: 6pt; font-weight: 900; letter-spacing: .08em; }
  .day-date  { font-size: 4.5pt; color: var(--mid); margin-top: .5mm; }

  .day-body { flex: 1; padding: 1mm 0 .8mm 2mm; display: flex; flex-direction: column; }

  .appt-label { font-size: 3.5pt; letter-spacing: .18em; color: var(--muted); margin-bottom: .8mm; }

  .ruled-lines { flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
  .ruled-line  { border-bottom: .25pt solid var(--line); }

  .wn-section {
    border-top: .8pt solid var(--navy); padding-top: 1mm;
    margin-top: 1mm; height: 14mm; flex-shrink: 0; display: flex; flex-direction: column;
  }

  .lp-footer {
    height: 6mm; flex-shrink: 0; border-top: .8pt solid var(--navy);
    display: flex; align-items: center; justify-content: space-between; margin-top: 1mm;
  }
  .footer-kw  { font-size: 3.8pt; font-weight: 800; letter-spacing: .16em; color: var(--navy); }
  .footer-sep { color: var(--muted); font-size: 4pt; margin: 0 .8mm; }
  .footer-qt  { font-size: 3.5pt; font-style: italic; color: var(--muted); }

  /* ══════════════════════════════════════════
     RIGHT PAGE — PLANNING  (A5)
  ══════════════════════════════════════════ */
  .right-page { padding: 5mm 6mm 4mm 6mm; }

  .rp-topbar {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1pt solid var(--navy); padding-bottom: 1.5mm; margin-bottom: 1.5mm;
  }
  .month-tabs { display: flex; gap: .6mm; }
  .mtab {
    font-size: 3.8pt; font-weight: 700; letter-spacing: .1em;
    color: var(--mid); padding: .6mm 1.2mm; border-radius: 1px;
  }
  .mtab.active { background: var(--navy); color: var(--white); }
  .week-no-wrap { display: flex; align-items: center; gap: 1.5mm; }
  .week-no-lbl  { font-size: 3.8pt; font-weight: 700; letter-spacing: .15em; color: var(--navy); }
  .week-no-val  { font-size: 7pt; font-weight: 800; color: var(--navy); }

  .rp-body { flex: 1; display: flex; gap: 3.5mm; overflow: hidden; min-height: 0; }
  .rp-col  { display: flex; flex-direction: column; overflow: hidden; }
  .rp-col-l { flex: 1.1; }
  .rp-col-r { flex: 1; }

  .rp-sec { display: flex; flex-direction: column; margin-bottom: 2.5mm; }
  .rp-sec-title {
    font-size: 3.8pt; font-weight: 900; letter-spacing: .2em; color: var(--navy);
    border-bottom: .6pt solid var(--navy); padding-bottom: .6mm; margin-bottom: 1.2mm;
  }
  .rp-sub { font-size: 3.5pt; font-weight: 700; letter-spacing: .14em; color: var(--mid); margin: .8mm 0 .5mm; }

  .cb-row  { display: flex; align-items: center; gap: 1.2mm; margin-bottom: .8mm; }
  .cb      { width: 2.3mm; height: 2.3mm; min-width: 2.3mm; border: .4pt solid var(--navy); flex-shrink: 0; }
  .cb-line { flex: 1; border-bottom: .25pt solid var(--line); height: 3.3mm; }

  .nl { border-bottom: .25pt solid var(--line); height: 3.8mm; }

  .appt-row { display: flex; gap: 1.2mm; align-items: flex-end; margin-bottom: 1.4mm; }
  .af { border-bottom: .5pt solid var(--navy); height: 3.3mm; }
  .af-date { width: 10mm; }
  .af-time { width: 7.5mm; }
  .af-desc { flex: 1; }

  .rp-footer {
    height: 6mm; flex-shrink: 0; border-top: .8pt solid var(--navy);
    display: flex; align-items: center; justify-content: space-between; margin-top: auto;
  }

  /* ── Print rules ── */
  @media print {
    @page { size: A5 portrait; margin: 0; }
    body  { background: white; }
    #print-bar { display: none; }
    .page {
      margin: 0;
      page-break-after: always;
      break-after: page;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>
</head>
<body>

<div id="print-bar">
  <span>TRANSCEND® PROPERTY MAINTENANCE — A5 DESK PLANNER 2026</span>
  <button onclick="window.print()">PRINT / SAVE PDF</button>
</div>

<div id="planner"></div>

<script>
(function () {
  const LOGO_BLACK = 'transcend-logo-black.png';

  const MONTHS      = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const PLAN_MONTHS = ['JUL','AUG','SEP','OCT','NOV','DEC'];
  const DAYS        = ['MON','TUE','WED','THU','FRI'];

  const QUOTES = [
    '"Plan with purpose. Execute with discipline."',
    '"Small daily improvements lead to stunning results."',
    '"Consistency beats intensity every time."',
    '"Focus is the new superpower."',
    '"Growth begins at the edge of comfort."',
    '"What you do today shapes who you become."',
    '"One week, one mission. Make it count."',
    '"Clarity precedes mastery."',
    '"Progress, not perfection."',
    '"The disciplined life is the free life."',
    '"Show up. Do the work. Repeat."',
    '"Every great week starts with a clear plan."',
    '"Win the morning, win the day."',
    '"Think long. Act now."',
    '"Your habits are your future."',
    '"Build something worth building."',
    '"Execution separates dreamers from achievers."',
    '"Stay the course. The results are coming."',
    '"Do less, better."',
    '"Silence the noise. Amplify the signal."',
    '"Great things are done by a series of small things."',
    '"Commit fully. Adjust wisely."',
    '"Purpose fuels persistence."',
    '"Discipline Today. Freedom Tomorrow."',
    '"Chase progress, not perfection."',
    '"Be relentless in the pursuit of your goals."',
    '"Vision without action is a daydream."',
  ];

  function fmt(d) { return MONTHS[d.getMonth()] + ' ' + d.getDate(); }

  function lines(n, cls) {
    let h = '';
    for (let i = 0; i < n; i++) h += `<div class="${cls}"></div>`;
    return h;
  }
  function cbRows(n) {
    let h = '';
    for (let i = 0; i < n; i++)
      h += `<div class="cb-row"><div class="cb"></div><div class="cb-line"></div></div>`;
    return h;
  }
  function apptRows(n) {
    let h = '';
    for (let i = 0; i < n; i++)
      h += `<div class="appt-row"><div class="af af-date"></div><div class="af af-time"></div><div class="af af-desc"></div></div>`;
    return h;
  }
  function monthTabs(idx) {
    return PLAN_MONTHS.map(m =>
      `<span class="mtab${MONTHS[idx] === m ? ' active' : ''}">${m}</span>`
    ).join('');
  }

  /* ── Cover ── */
  function coverPage() {
    const dots = Array(14).fill('<div class="spiral-dot"></div>').join('');
    return `
      <div class="page cover-page">
        <div class="cover-top">
          <img class="cover-logo-img" src="transcend-logo-color.png" alt="Transcend® Property Maintenance">
          <div class="cover-divider"></div>
          <div class="cover-tagline">BUILDING TRUST &nbsp;|&nbsp; DELIVERING QUALITY &nbsp;|&nbsp; EVERY TIME</div>
        </div>

        <div class="cover-banner">
          <div class="cover-planner-label">WEEKLY PLANNER</div>
          <div>
            <span class="cover-planner-title">DESK PLANNER &nbsp;</span>
            <span class="cover-planner-year">2026</span>
          </div>
          <div class="cover-planner-sub">JULY &mdash; DECEMBER &nbsp;|&nbsp; Plan Today. Execute Daily. Achieve More.</div>
        </div>

        <div class="spiral-dots">${dots}</div>

        <div class="cover-bottom">
          <div class="cover-icons-row">
            <div class="cover-icon-item">
              <div class="cover-icon-circle">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
              </div>
              <div class="cover-icon-label">TRANSCEND<br>PROPERTY</div>
              <div class="cover-icon-sub">MAINTENANCE</div>
            </div>
            <div class="cover-icon-item">
              <div class="cover-icon-circle">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
              </div>
              <div class="cover-icon-label">TPM<br>SERVICES</div>
              <div class="cover-icon-sub">PROFESSIONAL</div>
            </div>
            <div class="cover-icon-item">
              <div class="cover-icon-circle">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zm-.5 1.5l1.96 2.5H17V9.5h2.5zM6 18c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm11 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
              </div>

  /* ── Left weekly page ── */
  function leftPage(week, qi) {

  /* ── Build weeks ── */
  function buildWeeks() {
    const weeks = [];
    let monday = new Date(2026, 5, 29);
    const last  = new Date(2026, 11, 28);
    let weekNum = 27;
    while (monday <= last) {
      const wd = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday); d.setDate(d.getDate() + i); wd.push(d);
      }
      const end = new Date(monday); end.setDate(end.getDate() + 6);
      weeks.push({ weekNum, start: new Date(monday), end, days: wd });
      monday.setDate(monday.getDate() + 7);
      weekNum++;
    }
    return weeks;
  }

  /* ── Render ── */
  const weeks = buildWeeks();
  const container = document.getElementById('planner');
  let html = '';

  html += coverPage();
  html += insideCover();
  html += printShopPage();
  weeks.forEach((w, i) => { html += leftPage(w, i); html += rightPage(w); });

  container.innerHTML = html;
  console.log('Rendered: ' + (3 + weeks.length * 2) + ' pages (A5).');
